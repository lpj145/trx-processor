[package]
name = "trx-processor"
version = "0.1.0"
edition = "2024"
default-run = "trx-processor"

[[bin]]
name = "gen_transactions"
path = "./bin/gen_transactions.rs"

[dependencies]
rand = "0.10.2"
rayon = "1.12.0"
cache-size = "0.7.0"
aho-corasick = "1.1.5"
csv = "1.4.0"
serde = { version = "1.0", features = ["derive"] }